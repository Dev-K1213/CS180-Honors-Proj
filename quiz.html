
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Python → Java | Knowledge Check</title>

    <link rel="stylesheet" href="style.css">
    <script src="quiz.js" defer></script>
</head>

<body>
    <header class="site-header">
        <p class="eyebrow">PYTHON -> JAVA FIELD GUIDE</p>

        <h1>Knowledge Check</h1>

        <p class="intro">
            Test your understanding of the differences between
            Python and Java. See how well you can avoid common
            negative transfer traps.
        </p>

        <a href="index.html" class="quiz-back-link">
            ← Back to the Field Guide
        </a>
    </header>

    <main class="quiz-container">

        <div class="quiz-info">
            <span id="question-count">Question 1 of 10</span>
            <span id="score">Score: 0</span>
        </div>

        <div class="progress-track">
            <div id="progress-bar"></div>
        </div>

        <section id="quiz-content">
            <h2 id="question"></h2>

            <div id="options"></div>

            <div id="feedback" class="quiz-feedback"></div>

            <button id="next-button" disabled>
                Next Question →
            </button>
        </section>

        <section id="results" class="quiz-results" hidden>
            <h2>Quiz Complete!</h2>

            <p id="final-score"></p>

            <p id="final-message"></p>

            <button id="restart-button">
                Retake Quiz
            </button>

            <a href="index.html" class="quiz-back-link">
                Review the Field Guide
            </a>
        </section>

    </main>
</body>
</html>
